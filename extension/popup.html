<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Lichess Chess Bridge</title>
  <style>
    body {
      width: 300px;
      padding: 15px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      margin: 0;
    }
    
    h1 {
      font-size: 18px;
      margin: 0 0 15px 0;
      color: #333;
    }
    
    .status {
      display: flex;
      align-items: center;
      padding: 10px;
      border-radius: 5px;
      margin-bottom: 15px;
    }
    
    .status.connected {
      background-color: #e8f5e9;
      color: #2e7d32;
    }
    
    .status.disconnected {
      background-color: #ffebee;
      color: #c62828;
    }
    
    .status-indicator {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 10px;
    }
    
    .status.connected .status-indicator {
      background-color: #4caf50;
    }
    
    .status.disconnected .status-indicator {
      background-color: #f44336;
    }
    
    .info {
      margin-bottom: 15px;
      padding: 10px;
      background-color: #f5f5f5;
      border-radius: 5px;
      font-size: 13px;
      line-height: 1.5;
    }
    
    .info strong {
      display: block;
      margin-bottom: 5px;
      color: #333;
    }
    
    .button {
      width: 100%;
      padding: 10px;
      background-color: #4caf50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
    }
    
    .button:hover {
      background-color: #45a049;
    }
    
    .button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
    
    .footer {
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid #e0e0e0;
      font-size: 12px;
      color: #666;
      text-align: center;
    }
    
    .footer a {
      color: #1976d2;
      text-decoration: none;
    }
    
    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1>♟️ Lichess Chess Bridge</h1>
  
  <div id="status" class="status disconnected">
    <div class="status-indicator"></div>
    <div id="status-text">Disconnected</div>
  </div>
  
  <div class="info">
    <strong>How to use:</strong>
    1. Start the Rust application<br>
    2. Navigate to a Lichess game<br>
    3. The extension will automatically connect
  </div>
  
  <div class="info">
    <strong>Status:</strong>
    <div id="game-info">No active game</div>
  </div>
  
  <button id="reconnect-btn" class="button">Reconnect</button>
  
  <div class="footer">
    <a href="https://github.com/reductionfear/rustjslich" target="_blank">rustjslich</a> v1.0.0
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
